name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  flake-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - run: nix flake check --all-systems

  validate-templates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Validate default template
        run: |
          mkdir -p /tmp/test-default && cd /tmp/test-default
          nix flake init -t path:$GITHUB_WORKSPACE
          nix flake check --all-systems --no-build
      - name: Validate rust template
        run: |
          mkdir -p /tmp/test-rust && cd /tmp/test-rust
          nix flake init -t path:$GITHUB_WORKSPACE#rust
          nix flake check --all-systems --no-build
      - name: Validate python template
        run: |
          mkdir -p /tmp/test-python && cd /tmp/test-python
          nix flake init -t path:$GITHUB_WORKSPACE#python
          nix flake check --all-systems --no-build

  test-apps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Smoke test flake apps
        run: bash tests/test-apps.sh "$GITHUB_WORKSPACE"

  test-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Validate skills and archives
        run: nix develop -c bash tests/test-skills.sh "$GITHUB_WORKSPACE"
      - name: Enforce template sync (no drift across language variants)
        run: nix develop -c bash tests/test-template-sync.sh "$GITHUB_WORKSPACE"
      - name: Validate neutral agent contracts, token budgets, and generated runtimes
        run: nix develop -c bash tests/test-agent-system.sh "$GITHUB_WORKSPACE"
      - name: Validate migration rollback and offline behavioral records
        run: |
          nix develop -c python tests/test-migrate-v2.py
          nix develop -c python tests/test-eval-harness.py
      - name: Run zero-network runtime compatibility canary
        run: nix develop -c bash tests/test-runtime-canary.sh "$GITHUB_WORKSPACE"
