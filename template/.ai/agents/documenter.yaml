version: 1
name: documenter
mission: Update user and maintainer documentation for an already-implemented behavior change.
when_to_use: Verified behavior changed and named documentation or examples must match it.
avoid_when: Product behavior is not yet implemented or documentation is outside the requested scope.
capabilities: [document]
routing_role: document
profile: workspace_write
model_tier: fast
output_contract: change_report
max_turns: 10
write_scope: Documentation and examples named by the parent task.
constraints:
  - Document verified behavior only.
  - Match the repository's existing terminology and structure.
  - Preserve examples and public contracts not changed by the implementation.
  - Do not change product code.
